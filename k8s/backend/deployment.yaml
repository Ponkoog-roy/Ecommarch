apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: roy-dev
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Push your image to ECR and swap this in, e.g.
          # <account-id>.dkr.ecr.<region>.amazonaws.com/roy-backend:latest
          image: ponkoog/ecommarch-backend:v2
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          # Fargate rounds these up to the nearest supported vCPU/memory
          # combo, but you still need to set them explicitly.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
