# WARNING: This file is a TEMPLATE. Do not commit real secret values to git.
#
# Since this repo is meant to be synced by ArgoCD, the safer pattern is:
#   1. Do NOT put real values in this file.
#   2. Create the real Secret imperatively once, out-of-band:
#        kubectl create secret generic backend-secret \
#          --namespace roy-food-ordering \
#          --from-literal=DB_USER=royuser \
#          --from-literal=DB_PASSWORD='<rds-password>' \
#          --from-literal=JWT_SECRET='<long-random-string>'
#   3. Tell ArgoCD to ignore this resource's data (or exclude secret.yaml
#      from the tracked path) so it won't overwrite what you created.
#
# If you want ArgoCD to fully manage this secret instead, look at the
# "argocd-vault-plugin" or "External Secrets Operator" project — both let
# you keep only a *reference* to AWS Secrets Manager / SSM Parameter Store
# in git instead of the actual secret value.
#
# The block below is left in for local learning/testing with kubectl apply
# directly (NOT via ArgoCD) so `kubectl apply -f k8s/` works out of the box.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: roy-food-ordering
type: Opaque
stringData:
  DB_USER: "royuser"
  DB_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME_WITH_LONG_RANDOM_STRING"
