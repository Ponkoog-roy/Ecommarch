apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  namespace: roy-food-ordering
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # Cheap win: gzip text-based assets so pods can be small on Fargate.
      gzip on;
      gzip_types text/css application/javascript application/json image/svg+xml;

      # Used by the pod readiness/liveness probes.
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
