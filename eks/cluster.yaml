apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ecommarch
  region: ap-southeast-2
  version: "1.36"

iam:
  withOIDC: true

addons:
  - name: coredns
  - name: kube-proxy
  - name: vpc-cni
  - name: metrics-server

vpc:
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

cloudWatch:
  clusterLogging:
    enableTypes:
      - "*"

autoModeConfig:
  enabled: false

fargateProfiles:
  - name: fp-default
    selectors:
      - namespace: default

  - name: fp-kube-system
    selectors:
      - namespace: kube-system

  - name: fp-roy-dev
    selectors:
      - namespace: roy-dev